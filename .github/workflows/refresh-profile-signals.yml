name: Refresh profile signals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-signals
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install -r requirements.txt

      - name: Read public contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: kavya-jain14
        run: node scripts/fetch-contributions.mjs

      - name: Read repository, language and decision signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: kavya-jain14
        run: node scripts/fetch-profile-signals.mjs

      - name: Rebuild repo-driven profile visuals
        run: |
          python scripts/build-gargi-profile.py --signals-only
          node scripts/build-contribution-terrain.mjs
          node scripts/build-profile-numbers.mjs
          node scripts/build-decision-log.mjs
          node scripts/build-project-cards.mjs

      - name: Validate generated profile
        run: npm run validate

      - name: Commit only when a signal changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/contributions.json data/profile-signals.json assets/toolbox-*.svg assets/skill-radar-*.svg assets/numbers-*.svg assets/decision-log-*.svg assets/projects assets/generated/calendar-3d-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh activity signals"
          git push

name: Refresh profile signals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-signals
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read public contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: kavya-jain14
        run: node scripts/fetch-contributions.mjs

      - name: Rebuild the signal
        run: node scripts/build-activity-pulse.mjs

      - name: Generate the light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: kavya-jain14
          outputs: |
            assets/generated/snake-light.svg?color_snake=#007e70&color_dots=#edf5f2,#c7e9e2,#89d8cc,#3dbbaa,#007e70
            assets/generated/snake-dark.svg?color_snake=#55d8c7&color_dots=#121a1e,#1c3435,#285c58,#368c82,#55d8c7

      - name: Generate the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kavya-jain14

      - name: Extract solid-colour calendar variants
        run: node scripts/build-3d-calendar-variants.mjs profile-3d-contrib/profile-green-animate.svg

      - name: Commit only when a signal changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/activity-pulse-dark.svg assets/activity-pulse-light.svg assets/generated
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh activity signals"
          git push

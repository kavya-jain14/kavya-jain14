<svg width="1000" height="258" viewBox="0 0 1000 258" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relay-title relay-desc">
  <title id="relay-title">Kavya Jain's build relay</title>
  <desc id="relay-desc">A five-stage engineering path from idea through architecture, build, verification and shipping, annotated with current GitHub proof.</desc>
  <style>
    :root{--ink:#0D1117;--muted:#57606A;--line:#D0D7DE;--soft:#F6F8FA;--accent:#2563EB;--success:#1A7F37;--danger:#CF222E}
    @media (prefers-color-scheme:dark){:root{--ink:#F0F6FC;--muted:#8B949E;--line:#30363D;--soft:#161B22;--accent:#79C0FF;--success:#3FB950;--danger:#FF7B72}}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
    .muted{fill:var(--muted)}.tiny{font-size:10px;letter-spacing:.08em}.label{font-size:13px;letter-spacing:.14em;font-weight:700}.stage{font-size:12px;font-weight:700;letter-spacing:.08em}.detail{font-size:10px}
  </style>
  <text x="74" y="28" class="label">BUILD RELAY</text>
  <text x="926" y="28" text-anchor="end" class="muted tiny">PROCESS, NOT DECORATION</text>
  <path d="M74 42H926" stroke="var(--line)"/>
  <path d="M100 102H900" stroke="var(--line)" stroke-width="2"/>
  <g>
    <circle cx="100" cy="102" r="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="100" y="79" text-anchor="middle" class="stage">IDEA</text>
    <text x="100" y="132" text-anchor="middle" class="muted detail">Define the boundary</text>
    <animate attributeName="opacity" values=".35;1" begin="0.00s" dur=".42s" repeatCount="1" fill="freeze"/>
  </g>
  <g>
    <circle cx="300" cy="102" r="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="300" y="79" text-anchor="middle" class="stage">ARCHITECT</text>
    <text x="300" y="132" text-anchor="middle" class="muted detail">Freeze the contracts</text>
    <animate attributeName="opacity" values=".35;1" begin="0.48s" dur=".42s" repeatCount="1" fill="freeze"/>
  </g>
  <g>
    <circle cx="500" cy="102" r="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="500" y="79" text-anchor="middle" class="stage">BUILD</text>
    <text x="500" y="132" text-anchor="middle" class="muted detail">Build the vertical slice</text>
    <animate attributeName="opacity" values=".35;1" begin="0.96s" dur=".42s" repeatCount="1" fill="freeze"/>
  </g>
  <g>
    <circle cx="700" cy="102" r="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="700" y="79" text-anchor="middle" class="stage">VERIFY</text>
    <text x="700" y="132" text-anchor="middle" class="muted detail">Run the evidence</text>
    <animate attributeName="opacity" values=".35;1" begin="1.44s" dur=".42s" repeatCount="1" fill="freeze"/>
  </g>
  <g>
    <circle cx="900" cy="102" r="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="900" y="79" text-anchor="middle" class="stage">SHIP</text>
    <text x="900" y="132" text-anchor="middle" class="muted detail">Release the proof</text>
    <animate attributeName="opacity" values=".35;1" begin="1.92s" dur=".42s" repeatCount="1" fill="freeze"/>
  </g>
  <circle cx="900" cy="102" r="5" fill="var(--accent)">
    <animateMotion path="M-800 0H0" dur="2.45s" repeatCount="1" fill="freeze"/>
  </circle>
  <path d="M74 162H926" stroke="var(--line)"/>
  <text x="74" y="190" class="muted tiny">ACTIVE SYSTEM</text>
  <text x="74" y="214" class="stage">TRISHUL</text>
  <text x="286" y="190" class="muted tiny">LATEST PUSH</text>
  <text x="286" y="214" class="stage">28 AUG 2026</text>
  <text x="478" y="190" class="muted tiny">VERIFICATION</text>
  <text x="478" y="214" class="stage" fill="var(--success)">CHECKS PASSING</text>
  <text x="680" y="190" class="muted tiny">LATEST MERGED PR</text>
  <text x="680" y="214" class="stage">PR #22 · TRISHUL · MERGED</text>
</svg>
